<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление лицензиями</title>
    <link rel="stylesheet" href="/static/style.css">

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            background: white;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #dee2e6;
            word-wrap: break-word;
        }

        th {
            background: #f8f9fa;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Лицензионные ключи</h1>
</div>

<div style="width: 80%; margin: 20px auto;">

    <a href="/dashboard" style="text-decoration: none; color: #007bff;">← В меню</a>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
        <h2>Активные типы лицензий</h2>

        <a href="/add_license"
           style="background: #28a745; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px;">
            + Добавить лицензию
        </a>
    </div>

    <table>

        <thead>
            <tr>
                <th style="width: 10%; text-align:center;">ID</th>
                <th style="width: 40%;">Продукт</th>
                <th style="width: 20%; text-align:center;">Тип</th>
                <th style="width: 20%; text-align:center;">Срок (дни)</th>
                <th style="width: 10%; text-align:center;">Действия</th>
            </tr>
        </thead>

        <tbody>
            {{TABLE_ROWS}}
        </tbody>

    </table>

</div>

</body>
</html>
