<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список ПО</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="header">
        <h1>Панель управления ПО</h1>
    </div>

    <div style="width: 90%; margin: 20px auto;">
        <a href="/dashboard" style="display: block; margin-bottom: 15px; color: #007bff; text-decoration: none; font-weight: bold;">
            ← Вернуться в меню
        </a>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="color: #343a40;">Склад программного обеспечения</h2>
            <a href="/add_product" style="background: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 14px;">
                + Добавить ПО
            </a>
        </div>

        <table style="width: 100%; border-collapse: collapse; background: white; margin-top: 15px;">
            <thead>
                <tr style="background: #f8f9fa;">
                    <th>ID</th>
                    <th>Название продукта</th>
                    <th>Цена (руб.)</th>
                    <th>Версия</th>
                    <th>Действия</th> </tr>
            </thead>
            <tbody>
                {{TABLE_ROWS}}
            </tbody>
        </table>
    </div>
</body>
</html>
