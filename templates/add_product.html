<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление ПО</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="header">
        <h1>Добавить новый продукт</h1>
    </div>

    <div style="width: 400px; margin: 50px auto; background: white; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
        <form action="/add_product" method="POST">
            <label>Название продукта:</label><br>
            <input type="text" name="name" placeholder="Например: Photoshop" style="width: 100%; margin-bottom: 15px; padding: 8px;" required><br>

            <label>Версия:</label><br>
            <input type="text" name="version" placeholder="1.0.0" style="width: 100%; margin-bottom: 15px; padding: 8px;" required><br>

            <label>Цена (₽):</label><br>
            <input type="number" step="0.01" name="price" placeholder="0.00" style="width: 100%; margin-bottom: 20px; padding: 8px;" required><br>

            <button type="submit" style="background: #007bff; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; font-weight: bold;">
                Создать запись
            </button>
            <a href="/products" style="display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none;">Отмена</a>
        </form>
    </div>
</body>
</html>
