<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Магазин лицензий</title>
    <link rel="stylesheet" href="/static/style.css">

    <style>
        /* Стили для кнопки выхода */
        .logout-btn {
            display: inline-block;
            margin-top: 30px;
            color: #dc3545;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 20px;
            border: 1px solid #dc3545;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .logout-btn:hover {
            background-color: #dc3545;
            color: #ffffff;
        }

        /* Основная таблица */
        .shop-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            table-layout: auto;
        }

        .shop-table th {
            padding: 15px;
            border-bottom: 2px solid #dee2e6;
            background-color: #f8f9fa;
            text-align: left;
            font-size: 13px;
            white-space: nowrap;
        }

        .shop-table td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
            word-break: break-word;
        }

        .text-center {
            text-align: center !important;
        }

        /* Обновленная кнопка Купить */
        .btn-buy {
            background: #28a745;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            display: inline-block;
        }

        .btn-buy:hover {
            background: #218838;
        }

        /* Сбрасываем лишние отступы у формы внутри ячейки */
        .buy-form {
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>

<div class="header" style="text-align: center;">
    <h1>🛒 Магазин лицензий</h1>
</div>

<div class="box box-large" style="width: 90%; max-width: 1000px; margin: 20px auto; padding: 25px; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0;">Доступные предложения</h2>
    </div>

    <table class="shop-table">
        <thead>
            <tr>
                <th style="width: 50px;" class="text-center">ID</th>
                <th>Товар</th>
                <th>Тип лицензии</th>
                <th class="text-center">Срок</th>
                <th class="text-center">Цена</th>
                <th class="text-center">Действие</th>
            </tr>
        </thead>

        <tbody>
            {{TABLE_ROWS}}
        </tbody>
    </table>

    <div style="margin-top: 30px;">
        <a href="/logout" class="logout-btn">Выйти из аккаунта</a>
    </div>

</div>

</body>
</html>
