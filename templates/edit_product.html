<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование ПО</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="header">
        <h1>Редактирование продукта</h1>
    </div>

    <div style="width: 400px; margin: 50px auto; background: white; padding: 20px; border: 1px solid #ccc;">
        <form action="/edit_product" method="POST">
            <input type="hidden" name="product_id" value="{{ID}}">

            <label>Название:</label><br>
            <input type="text" name="name" value="{{NAME}}" style="width: 100%; margin-bottom: 15px;" required><br>

            <label>Версия:</label><br>
            <input type="text" name="version" value="{{VERSION}}" style="width: 100%; margin-bottom: 15px;" required><br>

            <label>Цена (₽):</label><br>
            <input type="number" step="0.01" name="price" value="{{PRICE}}" style="width: 100%; margin-bottom: 20px;" required><br>

            <button type="submit" style="background: #28a745; color: white; border: none; padding: 10px; width: 100%; cursor: pointer;">
                Сохранить изменения
            </button>
            <a href="/products" style="display: block; text-align: center; margin-top: 10px; color: #666; text-decoration: none;">Отмена</a>
        </form>
    </div>
</body>
</html>
