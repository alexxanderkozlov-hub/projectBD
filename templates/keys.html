<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление ключами</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body style="background-color: #f4f7f6; font-family: sans-serif;">

    <div class="header" style="background: #343a40; color: white; padding: 20px; text-align: center;">
        <h1>Панель управления ключами активации</h1>
    </div>

    <div style="width: 90%; margin: 30px auto;">
        <div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
            <a href="/dashboard" style="text-decoration: none; color: #007bff; font-weight: bold;">← В меню</a>
            <a href="/add_key" style="background: #28a745; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                + Выпустить новый ключ
            </a>
        </div>

        <table style="width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
            <thead>
                <tr style="background-color: #e9ecef; text-align: left;">
                    <th style="padding: 15px; border: 1px solid #dee2e6; text-align: center; width: 50px;">ID</th>
                    <th style="padding: 15px; border: 1px solid #dee2e6;">Продукт</th>
                    <th style="padding: 15px; border: 1px solid #dee2e6; text-align: center;">Лицензия</th>
                    <th style="padding: 15px; border: 1px solid #dee2e6; font-family: monospace;">Код ключа</th>
                    <th style="padding: 15px; border: 1px solid #dee2e6; text-align: center;">Статус</th>
                    <th style="padding: 15px; border: 1px solid #dee2e6; text-align: center;">Действия</th>
                </tr>
            </thead>
            <tbody>
                {{TABLE_ROWS}}
            </tbody>
        </table>
    </div>

</body>
</html>
